[tool.black]
line-length = 100
target-version = ["py311"]

# ruff ≥ 0.2.0 requiere [tool.ruff.lint] — el nivel raíz solo acepta
# opciones globales (line-length, target-version, etc.)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
